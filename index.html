<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Calendario</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#faf7f0">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;800&display=swap">
<style>
:root{--bg:#faf7f0;--paper:#fffdf8;--ink:#141210;--muted:#5f584e;--line:#e8e1d3;--err:#a3262e;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Poppins","Segoe UI",system-ui,sans-serif;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left)) 24px max(16px,env(safe-area-inset-right))}
.box{width:100%;max-width:380px;display:grid;gap:18px}
h1{margin:0;font-weight:800;font-size:44px;letter-spacing:-.02em;line-height:1}
p{margin:0;color:var(--muted)}
form{display:grid;gap:12px}
label{font-size:14px;font-weight:600}
input[type=password]{font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);width:100%}
input[type=password]:focus{outline:2px solid var(--ink);outline-offset:1px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);font-weight:500}
.check input{width:18px;height:18px;accent-color:var(--ink)}
button{font:inherit;font-weight:600;font-size:16px;padding:12px;border:0;border-radius:10px;background:var(--ink);color:var(--paper);cursor:pointer;min-height:48px}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
button[disabled]{opacity:.6;cursor:progress}
.err{color:var(--err);font-size:14px;font-weight:500;min-height:1.4em}
</style>
</head>
<body>
<main class="box" id="gate" hidden>
  <h1>Calendario</h1>
  <p>Calendario privado. Escribe la contraseña para abrirlo.</p>
  <form id="f">
    <label for="pw">Contraseña</label>
    <input type="password" id="pw" autocomplete="current-password" required>
    <button type="submit" id="go">Abrir calendario</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</main>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = a => btoa(String.fromCharCode(...new Uint8Array(a)));
const KEYNAME = "wa-key-" + BLOB.salt.slice(0, 8);

async function decryptWith(key){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(BLOB.iv)}, key, b64(BLOB.ct));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
async function keyFromPassword(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(BLOB.salt), iterations:BLOB.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
}
(async () => {
  // No se guarda nada: se borra cualquier clave recordada por versiones anteriores.
  try { Object.keys(localStorage).filter(k => k.startsWith("wa-key-")).forEach(k => localStorage.removeItem(k)); } catch(e){}
  document.getElementById("gate").hidden = false;
  document.getElementById("pw").focus();
})();
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const go = document.getElementById("go"), err = document.getElementById("err");
  go.disabled = true; go.textContent = "Abriendo…"; err.textContent = "";
  try {
    const key = await keyFromPassword(document.getElementById("pw").value);
    await decryptWith(key);
  } catch(_) {
    go.disabled = false; go.textContent = "Abrir calendario";
    err.textContent = "Contraseña incorrecta. Revisa mayúsculas y vuelve a intentar.";
  }
});
